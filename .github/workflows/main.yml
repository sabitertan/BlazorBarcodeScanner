name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The libraries multi-target net8.0/net9.0/net10.0, so every targeting pack is needed.
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore --nologo

    - name: Test
      run: dotnet test BlazorBarcodeScanner.Tests/BlazorBarcodeScanner.Tests.csproj --configuration Release --no-build --nologo

  deploy-to-github-pages:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    # The standalone demo hosts both readers behind a switcher.
    - name: Publish the demo app
      run: dotnet publish BlazorBarcodeScannerWasmStandalone/BlazorBarcodeScannerWasmStandalone.csproj -c Release -o release --nologo

    # changes the base-tag in index.html from '/' to 'BlazorBarcodeScanner' to match GitHub Pages repository subdirectory
    - name: Change base-tag in index.html from / to BlazorBarcodeScanner
      run: sed -i 's/<base href="\/" \/>/<base href="\/BlazorBarcodeScanner\/" \/>/g' release/wwwroot/index.html

    # copy index.html to 404.html to serve the same file when a file is not found
    - name: copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    # add .nojekyll file to tell GitHub pages to not treat this as a Jekyll project. (Allow files and folders starting with an underscore)
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    - name: Commit wwwroot to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: release/wwwroot
