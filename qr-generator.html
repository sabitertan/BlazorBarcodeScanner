<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Generator</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --fg: #14161a;
    --muted: #6b7280;
    --border: #e3e6ea;
    --accent: #2563eb;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a20;
      --fg: #e8eaed;
      --muted: #9aa3af;
      --border: #2a2f38;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 20px 56px;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { max-width: 940px; margin: 0 auto 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main {
    max-width: 940px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); } }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .row + .row { margin-top: 18px; }
  textarea, input[type=text] {
    width: 100%;
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    resize: vertical;
  }
  textarea { min-height: 96px; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1;
    font: inherit;
    padding: 8px 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] {
    width: 100%; height: 38px; padding: 2px;
    border: 1px solid var(--border); border-radius: 8px; background: transparent; cursor: pointer;
  }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
  .preview { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #qr {
    image-rendering: pixelated;
    border-radius: 6px;
    max-width: min(320px, 78vw);
    height: auto;
    display: block;
  }
  #meta { font-size: 12px; color: var(--muted); text-align: center; min-height: 18px; font-variant-numeric: tabular-nums; }
  #error { color: #dc2626; font-size: 13px; text-align: center; }
  .actions { display: flex; gap: 8px; width: 100%; }
  .actions button {
    flex: 1; font: inherit; font-weight: 600; font-size: 13px;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: transparent; color: var(--fg);
  }
  .actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .actions button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>QR Code Generator</h1>
  <p>Everything runs locally in your browser — no network, no libraries.</p>
</header>

<main>
  <section class="card">
    <div class="row">
      <label for="text">Content <span class="hint">— URL, text, Wi-Fi string, anything</span></label>
      <textarea id="text" spellcheck="false" placeholder="https://example.com">https://example.com</textarea>
    </div>

    <div class="row">
      <label>Error correction <span class="hint">— higher survives more damage, holds less data</span></label>
      <div class="seg" id="ecl">
        <button type="button" data-ecl="L">L · 7%</button>
        <button type="button" data-ecl="M" aria-pressed="true">M · 15%</button>
        <button type="button" data-ecl="Q">Q · 25%</button>
        <button type="button" data-ecl="H">H · 30%</button>
      </div>
    </div>

    <div class="row grid2">
      <div>
        <label for="scale">Export size <span class="hint" id="sizeLabel">512 px</span></label>
        <input type="range" id="scale" min="128" max="2048" step="64" value="512">
      </div>
      <div>
        <label for="quiet">Quiet zone <span class="hint" id="quietLabel">4 modules</span></label>
        <input type="range" id="quiet" min="0" max="8" step="1" value="4">
      </div>
    </div>

    <div class="row grid2">
      <div>
        <label for="fg">Foreground</label>
        <input type="color" id="fg" value="#000000">
      </div>
      <div>
        <label for="bg">Background</label>
        <input type="color" id="bg" value="#ffffff">
      </div>
    </div>
  </section>

  <section class="card preview">
    <canvas id="qr" width="10" height="10"></canvas>
    <div id="meta"></div>
    <div id="error"></div>
    <div class="actions">
      <button type="button" id="png">Download PNG</button>
      <button type="button" id="svg">Download SVG</button>
    </div>
  </section>
</main>

<script>
"use strict";
/* ------------------------------------------------------------------ *
 * QR Code encoder (ISO/IEC 18004) — versions 1-40, EC levels L/M/Q/H,
 * numeric / alphanumeric / byte modes, automatic mask selection.
 * ------------------------------------------------------------------ */

// ---- Galois field GF(256), primitive polynomial 0x11D --------------
const EXP = new Uint8Array(512), LOG = new Uint8Array(256);
for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
const gmul = (a, b) => (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]];

function rsGenPoly(degree) {
  let poly = [1];
  for (let i = 0; i < degree; i++) {
    const next = new Array(poly.length + 1).fill(0);
    for (let j = 0; j < poly.length; j++) {
      next[j] ^= poly[j];                    // multiply by x
      next[j + 1] ^= gmul(poly[j], EXP[i]);  // multiply by a^i
    }
    poly = next;
  }
  return poly;
}

function rsRemainder(data, ecLen) {
  const gen = rsGenPoly(ecLen);
  const buf = new Uint8Array(data.length + ecLen);
  buf.set(data);
  for (let i = 0; i < data.length; i++) {
    const coef = buf[i];
    if (coef !== 0) for (let j = 1; j < gen.length; j++) buf[i + j] ^= gmul(gen[j], coef);
  }
  return buf.slice(data.length);
}

// ---- Per-version tables (index 0 unused; rows are L, M, Q, H) ------
const EC_PER_BLOCK = [
  [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
  [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
  [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
  [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
];
const NUM_BLOCKS = [
  [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
  [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
  [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
  [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81],
];
const ECL = { L: { ord: 0, fmt: 1 }, M: { ord: 1, fmt: 0 }, Q: { ord: 2, fmt: 3 }, H: { ord: 3, fmt: 2 } };

function rawDataModules(ver) {
  let n = (16 * ver + 128) * ver + 64;
  if (ver >= 2) {
    const numAlign = Math.floor(ver / 7) + 2;
    n -= (25 * numAlign - 10) * numAlign - 55;
    if (ver >= 7) n -= 36;
  }
  return n;
}
const totalCodewords = ver => Math.floor(rawDataModules(ver) / 8);
const dataCodewords = (ver, ecl) => totalCodewords(ver) - EC_PER_BLOCK[ecl][ver] * NUM_BLOCKS[ecl][ver];

function alignPositions(ver) {
  if (ver === 1) return [];
  const numAlign = Math.floor(ver / 7) + 2, size = ver * 4 + 17;
  const step = ver === 32 ? 26 : Math.floor((ver * 4 + numAlign * 2 + 1) / (numAlign * 2 - 2)) * 2;
  const pos = [];
  for (let i = 0, p = size - 7; i < numAlign - 1; i++, p -= step) pos.unshift(p);
  pos.unshift(6);
  return pos;
}

// ---- Segment encoding ---------------------------------------------
const ALNUM = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:";
const MODE = {
  numeric: { id: 1, cc: [10, 12, 14], name: "Numeric" },
  alnum:   { id: 2, cc: [ 9, 11, 13], name: "Alphanumeric" },
  byte:    { id: 4, cc: [ 8, 16, 16], name: "Byte" },
};

function pushBits(bits, value, len) {
  for (let i = len - 1; i >= 0; i--) bits.push((value >>> i) & 1);
}

function makeSegment(text) {
  if (/^[0-9]*$/.test(text)) {
    const bits = [];
    for (let i = 0; i < text.length; i += 3) {
      const chunk = text.substr(i, 3);
      pushBits(bits, parseInt(chunk, 10), chunk.length * 3 + 1);
    }
    return { mode: MODE.numeric, count: text.length, bits };
  }
  if (/^[0-9A-Z $%*+\-./:]*$/.test(text)) {
    const bits = [];
    let i = 0;
    for (; i + 2 <= text.length; i += 2)
      pushBits(bits, ALNUM.indexOf(text[i]) * 45 + ALNUM.indexOf(text[i + 1]), 11);
    if (i < text.length) pushBits(bits, ALNUM.indexOf(text[i]), 6);
    return { mode: MODE.alnum, count: text.length, bits };
  }
  const bytes = new TextEncoder().encode(text);
  const bits = [];
  for (const b of bytes) pushBits(bits, b, 8);
  return { mode: MODE.byte, count: bytes.length, bits };
}

const ccLen = (seg, ver) => seg.mode.cc[ver <= 9 ? 0 : ver <= 26 ? 1 : 2];

// ---- Matrix construction ------------------------------------------
function buildMatrix(ver, eclName, codewords) {
  const size = ver * 4 + 17;
  const mods = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const setFn = (x, y, dark) => {
    if (x >= 0 && x < size && y >= 0 && y < size) { mods[y][x] = dark; fn[y][x] = true; }
  };
  const getBit = (v, i) => ((v >>> i) & 1) !== 0;

  // Timing patterns first — the finder patterns below deliberately overwrite
  // the overlapping run on row 6 / column 6.
  for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }

  // Finder patterns and their separators
  for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]])
    for (let dy = -4; dy <= 4; dy++)
      for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy));
        setFn(cx + dx, cy + dy, d !== 2 && d !== 4);
      }

  // Alignment patterns (skipping the three finder corners)
  const ap = alignPositions(ver);
  for (let i = 0; i < ap.length; i++)
    for (let j = 0; j < ap.length; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++)
        for (let dx = -2; dx <= 2; dx++)
          setFn(ap[i] + dx, ap[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }

  // Version information (version 7 and up)
  if (ver >= 7) {
    let rem = ver;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1F25);
    const bits = (ver << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const bit = getBit(bits, i), a = size - 11 + (i % 3), b = Math.floor(i / 3);
      setFn(a, b, bit); setFn(b, a, bit);
    }
  }

  function drawFormat(mask) {
    const data = (ECL[eclName].fmt << 3) | mask;
    let rem = data;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const bits = ((data << 10) | rem) ^ 0x5412;
    for (let i = 0; i <= 5; i++) setFn(8, i, getBit(bits, i));
    setFn(8, 7, getBit(bits, 6));
    setFn(8, 8, getBit(bits, 7));
    setFn(7, 8, getBit(bits, 8));
    for (let i = 9; i < 15; i++) setFn(14 - i, 8, getBit(bits, i));
    for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(bits, i));
    for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(bits, i));
    setFn(8, size - 8, true); // always-dark module
  }
  drawFormat(0); // reserve the area so codeword placement skips it

  // Place codewords in the zigzag pattern, bottom-right upward
  let idx = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        const upward = ((right + 1) & 2) === 0;
        const y = upward ? size - 1 - vert : vert;
        if (!fn[y][x] && idx < codewords.length * 8) {
          mods[y][x] = ((codewords[idx >>> 3] >>> (7 - (idx & 7))) & 1) !== 0;
          idx++;
        }
      }
    }
  }

  const MASKS = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x, y) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
    (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
    (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0,
    (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0,
  ];
  const applyMask = m => {
    for (let y = 0; y < size; y++)
      for (let x = 0; x < size; x++)
        if (!fn[y][x] && MASKS[m](x, y)) mods[y][x] = !mods[y][x];
  };

  // Pick the mask with the lowest penalty score
  let best = 0, bestScore = Infinity;
  for (let m = 0; m < 8; m++) {
    applyMask(m); drawFormat(m);
    const score = penalty(mods, size);
    if (score < bestScore) { bestScore = score; best = m; }
    applyMask(m); // undo (XOR is its own inverse)
  }
  applyMask(best); drawFormat(best);
  return mods;
}

function penalty(mods, size) {
  const N1 = 3, N2 = 3, N3 = 40, N4 = 10;
  let result = 0;

  const addHistory = (run, hist) => {
    if (hist[0] === 0) run += size;     // virtual light border before the first run
    hist.copyWithin(1, 0, 6);
    hist[0] = run;
  };
  const countPatterns = h => {
    const n = h[1];
    const core = n > 0 && h[2] === n && h[3] === n * 3 && h[4] === n && h[5] === n;
    return (core && h[0] >= n * 4 && h[6] >= n ? 1 : 0) + (core && h[6] >= n * 4 && h[0] >= n ? 1 : 0);
  };
  const terminate = (color, run, hist) => {
    if (color) { addHistory(run, hist); run = 0; }
    addHistory(run + size, hist);       // virtual light border after the last run
    return countPatterns(hist);
  };

  const scanLine = get => {
    for (let a = 0; a < size; a++) {
      let color = false, run = 0;
      const hist = new Int32Array(7);
      for (let b = 0; b < size; b++) {
        if (get(a, b) === color) {
          run++;
          if (run === 5) result += N1; else if (run > 5) result++;
        } else {
          addHistory(run, hist);
          if (!color) result += countPatterns(hist) * N3;
          color = get(a, b); run = 1;
        }
      }
      result += terminate(color, run, hist) * N3;
    }
  };
  scanLine((y, x) => mods[y][x]);   // rows
  scanLine((x, y) => mods[y][x]);   // columns

  // 2x2 blocks of one color
  for (let y = 0; y < size - 1; y++)
    for (let x = 0; x < size - 1; x++) {
      const c = mods[y][x];
      if (c === mods[y][x + 1] && c === mods[y + 1][x] && c === mods[y + 1][x + 1]) result += N2;
    }

  // Global dark/light balance
  let dark = 0;
  for (const row of mods) for (const m of row) if (m) dark++;
  const total = size * size;
  const k = Math.ceil((Math.abs(dark * 20 - total * 10)) / total) - 1;
  return result + k * N4;
}

function generateQR(text, eclName) {
  const ecl = ECL[eclName].ord;
  const seg = makeSegment(text);

  let ver = 0;
  for (let v = 1; v <= 40; v++) {
    if (4 + ccLen(seg, v) + seg.bits.length <= dataCodewords(v, ecl) * 8) { ver = v; break; }
  }
  if (ver === 0) throw new Error("Too much data — even a version 40 code can't hold this at level " + eclName + ".");

  const capacity = dataCodewords(ver, ecl) * 8;
  const bits = [];
  pushBits(bits, seg.mode.id, 4);
  pushBits(bits, seg.count, ccLen(seg, ver));
  bits.push(...seg.bits);
  pushBits(bits, 0, Math.min(4, capacity - bits.length));            // terminator
  pushBits(bits, 0, (8 - bits.length % 8) % 8);                      // byte align
  for (let pad = 0xEC; bits.length < capacity; pad ^= 0xEC ^ 0x11) pushBits(bits, pad, 8);

  const data = new Uint8Array(bits.length / 8);
  bits.forEach((b, i) => { if (b) data[i >>> 3] |= 1 << (7 - (i & 7)); });

  // Split into blocks, add Reed-Solomon, then interleave
  const numBlocks = NUM_BLOCKS[ecl][ver], ecLen = EC_PER_BLOCK[ecl][ver];
  const raw = totalCodewords(ver);
  const shortLen = Math.floor(raw / numBlocks);
  const numShort = numBlocks - (raw % numBlocks);
  const dataBlocks = [], ecBlocks = [];
  for (let i = 0, k = 0; i < numBlocks; i++) {
    const len = shortLen - ecLen + (i < numShort ? 0 : 1);
    const block = data.slice(k, k + len); k += len;
    dataBlocks.push(block);
    ecBlocks.push(rsRemainder(block, ecLen));
  }
  const out = new Uint8Array(raw);
  let p = 0;
  for (let i = 0; i < shortLen - ecLen + 1; i++)
    for (const b of dataBlocks) if (i < b.length) out[p++] = b[i];
  for (let i = 0; i < ecLen; i++)
    for (const b of ecBlocks) out[p++] = b[i];

  return { modules: buildMatrix(ver, eclName, out), version: ver, mode: seg.mode.name, count: seg.count };
}

/* ------------------------------------------------------------------ *
 * UI
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const canvas = $("qr"), ctx = canvas.getContext("2d");
let eclName = "M", current = null;

function render() {
  const text = $("text").value;
  const quiet = +$("quiet").value;
  const target = +$("scale").value;
  $("sizeLabel").textContent = target + " px";
  $("quietLabel").textContent = quiet + (quiet === 1 ? " module" : " modules");

  $("error").textContent = "";
  if (!text) {
    current = null;
    $("meta").textContent = "Enter some content to generate a code.";
    canvas.width = canvas.height = 10;
    ctx.clearRect(0, 0, 10, 10);
    $("png").disabled = $("svg").disabled = true;
    return;
  }

  let qr;
  try {
    qr = generateQR(text, eclName);
  } catch (e) {
    current = null;
    $("error").textContent = e.message;
    $("meta").textContent = "";
    $("png").disabled = $("svg").disabled = true;
    return;
  }

  current = qr;
  const size = qr.modules.length, dim = size + quiet * 2;
  const scale = Math.max(1, Math.round(target / dim));
  canvas.width = canvas.height = dim * scale;

  ctx.fillStyle = $("bg").value;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = $("fg").value;
  for (let y = 0; y < size; y++)
    for (let x = 0; x < size; x++)
      if (qr.modules[y][x]) ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);

  $("meta").textContent =
    `Version ${qr.version} · ${size}×${size} modules · ${qr.mode} mode · ` +
    `${qr.count} ${qr.mode === "Byte" ? "bytes" : "chars"} · level ${eclName} · ${canvas.width}px`;
  $("png").disabled = $("svg").disabled = false;
}

function download(href, name) {
  const a = document.createElement("a");
  a.href = href; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

$("png").onclick = () => download(canvas.toDataURL("image/png"), "qrcode.png");

$("svg").onclick = () => {
  if (!current) return;
  const quiet = +$("quiet").value, size = current.modules.length, dim = size + quiet * 2;
  let path = "";
  for (let y = 0; y < size; y++)
    for (let x = 0; x < size; x++)
      if (current.modules[y][x]) path += `M${x + quiet},${y + quiet}h1v1h-1z`;
  const svg =
`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" width="${+$("scale").value}" height="${+$("scale").value}" shape-rendering="crispEdges">
<rect width="${dim}" height="${dim}" fill="${$("bg").value}"/>
<path d="${path}" fill="${$("fg").value}"/>
</svg>`;
  download("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg), "qrcode.svg");
};

$("ecl").addEventListener("click", e => {
  const btn = e.target.closest("button[data-ecl]");
  if (!btn) return;
  eclName = btn.dataset.ecl;
  for (const b of $("ecl").children) b.setAttribute("aria-pressed", String(b === btn));
  render();
});

for (const id of ["text", "scale", "quiet", "fg", "bg"]) $(id).addEventListener("input", render);
render();
</script>
</body>
</html>
